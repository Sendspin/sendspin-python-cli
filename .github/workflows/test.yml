# This workflow will install Python dependencies and run linting and tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@v7.3.1
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra test
      - name: Lint with pre-commit
        run: SKIP=no-commit-to-branch uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6.0.2
      - name: Install PortAudio and PulseAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio
      - name: Start PulseAudio
        run: pulseaudio --start --exit-idle-time=-1
      - name: Install uv
        uses: astral-sh/setup-uv@v7.3.1
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra test
      - name: Test with pytest
        run: uv run pytest
